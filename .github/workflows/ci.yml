name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/aux4-embedding-test-cache
          key: aux4-embedding-model-text-q8-${{ runner.os }}

      - name: Cache runtime dependencies (installed lazily by embed.mjs on first use)
        uses: actions/cache@v4
        with:
          path: package/lib/node_modules
          key: aux4-embedding-runtime-deps-${{ runner.os }}-${{ hashFiles('package/lib/package-lock.json') }}

      - uses: aux4/action@v1
        with:
          command: test
          build_command: npm run build
